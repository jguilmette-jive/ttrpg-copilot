name: ttrpg-copilot
services:
  pgvector-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ttrpg
    ports:
      - "5432:5432"
    volumes:
        - postgres_data:/var/lib/postgresql/data
        - ./init:/docker-entrypoint-initdb.d
volumes:
  postgres_data: